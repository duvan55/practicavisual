<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentos Memorables — Duvan & Laurent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="momentos.css">
</head>
<body>

  <header class="nav">
    <a href="momentos.html" class="nav-brand">D <span>&amp;</span> L</a>
    <nav class="nav-links">
      <a href="momentos.html" class="nav-link is-active">Momentos</a>
      <a href="galeria.html" class="nav-link">Galería</a>
      <a href="carta.html" class="nav-link">La Carta</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-eyebrow">Un álbum para dos</p>
      <h1 class="hero-title">Momentos<br>Memorables</h1>
      <p class="hero-sub">Seis instantes que quiero guardar para siempre.</p>
    </section>

    <section class="momentos-grid" id="momentosGrid">

      <!--
        ================================================
        CÓMO PONER TUS FOTOS Y TEXTOS AQUÍ:
        1) Guarda tus 6 fotos dentro de una carpeta llamada
           "images" al lado de este archivo (momentos.html).
        2) Reemplaza el valor de src="" de cada <img> por la
           ruta de tu foto, por ejemplo: src="images/foto1.jpg"
        3) Escribe el recuerdo de cada momento dentro del
           <p class="momento-cap">...</p> correspondiente.
        Ya NO se puede editar nada de esto desde la página,
        solo aquí, directamente en el código.
        ================================================
      -->

      <figure class="momento-card" style="--r:-3deg">
        <span class="momento-num">Momento 01</span>
        <div class="momento-imgwrap">
          <img class="momento-img" src="ella.img/1787801105599.jpg" alt="Momento 1 con Laurent">
        </div>
        <p class="momento-cap">Tus visitas a mariaP fueron las mejores, me alegraste varios dias en esa soledad.</p>
      </figure>

      <figure class="momento-card" style="--r:2deg">
        <span class="momento-num">Momento 02</span>
        <div class="momento-imgwrap">
          <img class="momento-img" src="ella.img/1787801105410.jpg" alt="Momento 2 con Laurent">
        </div>
        <p class="momento-cap">poder vernos un rato en el parque y quedarnos hablando de cualquier cosa es lo mejor, esa sensación no la cambio por nada.
          por cierto, no me asustaste cuando llegaste por la espalda JAJAJ.</p>
      </figure>

      <figure class="momento-card" style="--r:-2deg">
        <span class="momento-num">Momento 03</span>
        <div class="momento-imgwrap">
          <img class="momento-img" src="ella.img/IMG-20260704-WA0108.jpg" alt="Momento 3 con Laurent">
        </div>
        <p class="momento-cap">En el cumpleaños de mi hermano me di cuenta de lo tanto que me estabas llegando a querer, el solo aceptar estar ahi con parte de mi familia fue muy valiente de tu parte.
          Ese dia la pase muy bien contigo y no importo que te tuviera que llegar tan rapido a tu casa.</p>
      </figure>

      <figure class="momento-card" style="--r:3deg">
        <span class="momento-num">Momento 04</span>
        <div class="momento-imgwrap">
          <img class="momento-img" src="ella.img/IMG-20260720-WA0107.jpg" alt="Momento 4 con Laurent">
        </div>
        <p class="momento-cap">JAJAJA esta imagen la amo, no sabes cuanto sueño con lograr tener una niña asi de hermosa como tú.</p>
      </figure>

      <figure class="momento-card" style="--r:-2.5deg">
        <span class="momento-num">Momento 05</span>
        <div class="momento-imgwrap">
         <video class="momento-img" src="ella.img/VID-20260819-WA0021.mp4" controls playsinline></video>
        </div>
        <p class="momento-cap">Momentos antes de la tragedia, ese dia no comiste nada y senti que solo la pase bien yo, pero aunque fuera asi
          me hiciste sentir un buen rato, tambien cuando estabamos acostados en la mesedora
          y pude por primera vez cargarte y sentir el peso de la mujer de mis sueños.</p>
      </figure>

      <figure class="momento-card" style="--r:2.5deg">
        <span class="momento-num">Momento 06</span>
        <div class="momento-imgwrap">
          <img class="momento-img" src="ella.img/IMG-20260701-WA0094(2).jpg" alt="Momento 6 con Laurent">
        </div>
        <p class="momento-cap">Esta foto nunca te gustó, pero yo la guardo como un recuerdo preciado y nunca olvidare todo lo que hemos pasado en tan poco tiempo. En estos meses de conocerte 
          me pasaron más cosas lindas a tu lado que tal vez en toda mi vida.</p>
      </figure>

    </section>
  </main>

  <footer class="site-footer">hecho con el corazón, para Laurent.</footer>

<script src="momentos.js"></script>
</body>
</html>
