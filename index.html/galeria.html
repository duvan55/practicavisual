<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Lo Más Bello — Duvan & Laurent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="galeria.css">
</head>
<body>

  <header class="nav">
    <a href="momentos.html" class="nav-brand">D <span>&amp;</span> L</a>
    <nav class="nav-links">
      <a href="momentos.html" class="nav-link">Momentos</a>
      <a href="galeria.html" class="nav-link is-active">Galería</a>
      <a href="carta.html" class="nav-link">La Carta</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="hero-eyebrow">Sin límite de recuerdos</p>
      <h1 class="hero-title">Galería de<br>Lo Más Bello</h1>
      <p class="hero-sub">Cada foto que quieras agregar aquí, se pone directamente en el código.</p>
    </section>

    <!--
      ================================================
      CÓMO AGREGAR FOTOS A ESTA GALERÍA:
      1) Guarda tus fotos dentro de una carpeta llamada
         "images" al lado de este archivo (galeria.html).
      2) Copia un bloque <figure class="galeria-card">...</figure>
         completo (como el de ejemplo de abajo) y pégalo
         dentro de <section class="galeria-grid">, tantas
         veces como fotos quieras agregar. No hay límite.
      3) Cambia el src="" por la ruta de tu foto y escribe
         la descripción dentro de <p class="galeria-cap">.
      Ya NO se puede subir ni editar nada desde la página,
      solo aquí, directamente en el código.
      ================================================
    -->
    <section class="galeria-grid" id="galeriaGrid">

      <figure class="galeria-card" style="--r:-2.5deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/IMG-20260701-WA0562.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">Creo que ponerte que te ves hermosa se queda corto, mejor solo observar tanta divinidad.</p>
      </figure>

      <figure class="galeria-card" style="--r:2deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/IMG-20260701-WA0563.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">Solo la puse por poner, recorde las fotos que ignore el dia de cine, me lamento por eso. No pude verlas despues porque salia que ya no se podia abrir.</p>
      </figure>

      <figure class="galeria-card" style="--r:-1.5deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/IMG-20260719-WA0060.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">No se si es la iluminación que te hizo ver tan linda JAJA. Me mata ver tus fotos ¡me llena de un sentimiento tan lindo!</p>
      </figure>

      <figure class="galeria-card" style="--r:-1.5deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/IMG-20260719-WA0062.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">Perfil de modelo, pero cuando perfil en la notaria como mi esposa JAJAJ.</p>
      </figure>

      <figure class="galeria-card" style="--r:-1.5deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/IMG-20260812-WA0008.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">Una de mis favoritas, se ve malota con ese camibuso, tras de eso las cejas se te ven hermosas y completas con todo tu rostro que para mi es la perfección.</p>
      </figure>

      <figure class="galeria-card" style="--r:-1.5deg">
        <div class="galeria-imgwrap">
          <img src="galeriaLAU/1787803128840.jpg" alt="Foto del álbum">
        </div>
        <p class="galeria-cap">No recuerdo bien, solo que ver esta foto me trajo el pensamiento de nuestro primer piquito, ee dia fue tan unico. .</p>
      </figure>

      <!-- Copia el bloque de arriba y pégalo aquí abajo para agregar más fotos -->

    </section>
  </main>

  <footer class="site-footer">cada foto, un latido guardado.</footer>

<script src="galeria.js"></script>
</body>
</html>
